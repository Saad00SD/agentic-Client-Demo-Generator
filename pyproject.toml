[project]
name = "lkq-ecp-sherbet-demo"
version = "0.1.0"
description = "Generate branded client demo websites from a reusable master template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]
